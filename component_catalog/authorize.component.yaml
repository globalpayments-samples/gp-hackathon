  bricks/fragments/authorize-frontend.js: FRONTEND_CONFIG
test_fragments:
  - bricks/tests/authorize.test.js
  - bricks/tests/fixtures/sandbox.js
source_repo: online-payments-auth-and-delayed-capture
extraction_difficulty: low
