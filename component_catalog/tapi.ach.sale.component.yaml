id: tapi.ach.sale
layer: brick
name: ACH sale
description: Debit a US bank account with an integrated ACH check sale
platform: tapi
integration_mode: server-sdk
supported_languages: [php]
region: [US]
test_strategy: [component, contract]
config_required:
  php: [TAPI_ACCOUNT_CREDENTIAL, TAPI_API_KEY, TAPI_API_SECRET, TAPI_REGION]
files:
  php: [bricks/tapi/php/ach-lifecycle.php]
inserts:
  php:
    bricks/tapi/fragments/php/import-ach-lifecycle.php: IMPORTS
    bricks/tapi/fragments/php/ach-sale-route.php: ROUTE_HANDLERS
test_fragments:
  php: [bricks/tapi/tests/php/ach-contract.php, bricks/tapi/tests/fixtures/ach.json]
