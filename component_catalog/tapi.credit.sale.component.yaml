id: tapi.credit.sale
layer: brick
name: Credit sale
description: Submit an integrated credit sale
platform: tapi
integration_mode: server-sdk
supported_languages: [php, dotnet]
region: [US, CA]
test_strategy: [component, contract, live]
config_required:
  php: [TAPI_ACCOUNT_CREDENTIAL, TAPI_API_KEY, TAPI_API_SECRET, TAPI_REGION]
  dotnet: [TAPI_ACCOUNT_CREDENTIAL, TAPI_API_SECRET, TAPI_REGION]
files:
  php: [bricks/tapi/php/credit-lifecycle.php]
  dotnet: [bricks/tapi/dotnet/CreditLifecycle.cs]
inserts:
  php:
    bricks/tapi/fragments/php/import-credit-lifecycle.php: IMPORTS
    bricks/tapi/fragments/php/sale-route.php: ROUTE_HANDLERS
  dotnet:
    bricks/tapi/fragments/dotnet/sale-route.cs: ROUTE_HANDLERS
test_fragments:
  php: [bricks/tapi/tests/php/contract.php, bricks/tapi/tests/fixtures/credit.json]
  dotnet: [bricks/tapi/tests/dotnet/ContractTests.cs, bricks/tapi/tests/fixtures/credit.json]
